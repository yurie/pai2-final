<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>CRANE+ クイズチャレンジ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182a35;
      --muted: #667983;
      --paper: #f5f2eb;
      --card: #fffefa;
      --line: #dce3df;
      --teal: #167c78;
      --teal-dark: #0d605d;
      --coral: #d8674f;
      --gold: #e9b65b;
      --shadow: 0 24px 70px rgba(27, 51, 58, .11);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 88% 8%, rgba(233, 182, 91, .2), transparent 28rem),
        radial-gradient(ellipse at 8% 92%, rgba(22, 124, 120, .13), transparent 32rem),
        var(--paper);
      font-family: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(100% - 36px, 980px); margin: 0 auto; padding: 30px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 56px; }
    .brand { display: flex; gap: 12px; align-items: center; font-size: 14px; font-weight: 800; letter-spacing: .08em; }
    .brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 13px; color: white; background: var(--teal); box-shadow: 0 8px 18px rgba(22,124,120,.2); }
    .connection { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64a875; box-shadow: 0 0 0 4px rgba(100,168,117,.12); }
    main { max-width: 760px; margin: 0 auto; }
    .eyebrow { margin: 0 0 14px; color: var(--teal); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.14; letter-spacing: -.045em; white-space: nowrap; }
    .lead { margin: 18px 0 30px; color: var(--muted); font-size: clamp(12px, 1.6vw, 14px); line-height: 1.8; white-space: nowrap; }
    .card { overflow: hidden; border: 1px solid rgba(220,227,223,.9); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
    .setup { padding: clamp(24px, 5vw, 42px); }
    .setup h2, .result h2 { margin: 0 0 8px; font-size: 22px; }
    .sub { margin: 0 0 25px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    label { display: grid; gap: 8px; color: #40545d; font-size: 13px; font-weight: 700; }
    input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: white; color: var(--ink); }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22,124,120,.12); }
    textarea { width: 100%; min-height: 130px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: white; color: var(--ink); line-height: 1.7; resize: vertical; }
    textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(22,124,120,.12); }
    .primary { min-height: 50px; padding: 0 22px; border: 0; border-radius: 13px; color: white; background: var(--teal); font-weight: 800; transition: transform .15s, background .15s; }
    .primary:hover { transform: translateY(-1px); background: var(--teal-dark); }
    .primary:disabled { cursor: wait; opacity: .6; transform: none; }
    .judge-actions { display: flex; gap: 12px; margin-top: 26px; }
    .judge-actions .primary { min-width: 150px; }
    .incorrect-button { background: var(--coral); }
    .incorrect-button:hover { background: #b9513c; }
    .quiet-button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 700; }
    .quiet-button:hover { border-color: var(--teal); color: var(--teal-dark); background: #f3faf8; }
    .ai-label { margin: 0 0 8px; color: var(--teal); font-size: 12px; font-weight: 900; letter-spacing: .12em; }
    .ai-answer { margin-top: 22px; padding: 20px; border-radius: 16px; background: #f1f6f3; }
    .ai-answer-text { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 800; line-height: 1.5; }
    .ai-reason { margin: 12px 0 0; color: var(--muted); line-height: 1.8; }
    .hint { margin: 16px 0 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .quiz { display: none; }
    .quiz-top { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 20px 26px; border-bottom: 1px solid var(--line); }
    .progress-label { font-size: 13px; font-weight: 800; }
    .score { color: var(--muted); font-size: 13px; }
    .progress-track { height: 5px; background: #e9eeea; }
    .progress-bar { width: 0; height: 100%; background: var(--gold); transition: width .35s; }
    .question-area { padding: clamp(26px, 6vw, 52px); }
    .question-kicker { color: var(--coral); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .question { min-height: 100px; margin: 16px 0 28px; font-size: clamp(23px, 4vw, 34px); line-height: 1.55; letter-spacing: -.025em; }
    .answer-row { display: flex; gap: 12px; }
    .answer-row input { flex: 1; min-width: 0; }
    .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .choice { display: flex; min-height: 72px; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: white; text-align: left; transition: border-color .15s, transform .15s, background .15s; }
    .choice:hover { transform: translateY(-2px); border-color: var(--teal); background: #f3faf8; }
    .choice:focus-visible { outline: 3px solid rgba(22,124,120,.24); outline-offset: 2px; }
    .choice:disabled { cursor: wait; opacity: .6; }
    .choice-letter { display: grid; width: 30px; height: 30px; flex: 0 0 30px; place-items: center; border-radius: 9px; color: var(--teal-dark); background: #e4f2ee; font-size: 12px; font-weight: 900; }
    .choice-code { font-size: 19px; font-weight: 900; letter-spacing: .08em; }
    .retry-panel { display: none; margin-top: 18px; }
    .feedback { display: none; margin: 0 0 22px; padding: 16px 18px; border-radius: 14px; background: #f0f5f2; }
    .feedback.good { background: #eaf5ee; }
    .feedback.bad { background: #fbefeb; }
    .feedback-title { margin: 0 0 6px; font-size: 15px; font-weight: 800; }
    .feedback p { margin: 4px 0 0; color: #43575f; font-size: 13px; line-height: 1.7; }
    .status { min-height: 20px; margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .result { display: none; padding: clamp(30px, 6vw, 54px); text-align: center; }
    .result-mark { display: grid; width: 64px; height: 64px; margin: 0 auto 20px; place-items: center; border-radius: 20px; color: #77541f; background: #fbefcf; font-size: 26px; }
    .result-score { margin: 16px 0 26px; color: var(--teal); font-size: clamp(42px, 8vw, 64px); font-weight: 900; letter-spacing: -.06em; }
    footer { margin-top: 34px; color: #829097; font-size: 11px; text-align: center; }
    @media (max-width: 560px) {
      .shell { width: min(100% - 24px, 980px); padding-top: 18px; }
      header { margin-bottom: 36px; }
      .fields { grid-template-columns: 1fr; }
      .lead { white-space: normal; }
      .quiz-top { padding: 17px 20px; }
      .judge-actions { flex-direction: column; }
      .judge-actions .primary { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">＋</span><span>CRANE+ QUIZ</span></div>
      <div class="connection"><span class="dot" aria-hidden="true"></span><span>シミュレーター連携</span></div>
    </header>

    <main>
      <p class="eyebrow">YOU ASK · AI ANSWERS</p>
      <h1>Judge AI</h1>
      <p class="lead">問題を入力するとOllamaが回答します。正誤の判定に応じてアームが動きます。</p>

      <section class="card setup" id="ask-card" aria-labelledby="ask-title">
        <h2 id="ask-title">問題を出す</h2>
        <p class="sub">AIは回答と短い理由を返します。答えが分からない場合は、推測せずにそう答えるよう指示しています。</p>
        <form id="ask-form">
          <label for="question-input">あなたの問題</label>
          <textarea id="question-input" name="question" maxlength="2000" placeholder="例：日本で一番高い山は何ですか？" required></textarea>
          <p class="status" id="ask-status" role="status" aria-live="polite"></p>
          <button class="primary" id="ask-button" type="submit">AIに回答させる <span aria-hidden="true">→</span></button>
        </form>
      </section>

      <section class="card quiz" id="answer-card" aria-live="polite">
        <div class="quiz-top">
          <span class="progress-label" id="round-label"></span>
          <span class="score" id="score-label"></span>
          <button class="quiet-button" id="reset-button" type="button">リセット</button>
        </div>
        <div class="question-area">
          <div class="question-kicker">あなたの問題</div>
          <h2 class="question" id="asked-question"></h2>
          <div class="ai-answer">
            <p class="ai-label">OLLAMAの回答</p>
            <p class="ai-answer-text" id="ai-answer"></p>
            <p class="ai-reason" id="ai-reason"></p>
          </div>
          <div class="feedback" id="judgement-feedback" role="status" aria-live="polite"></div>
          <div class="judge-actions" id="judge-actions">
            <button class="primary" id="correct-button" type="button">正解</button>
            <button class="primary incorrect-button" id="incorrect-button" type="button">不正解</button>
          </div>
          <p class="status" id="motion-status" role="status" aria-live="polite"></p>
        </div>
      </section>
    </main>
    <footer>CRANE+ V2 · PAI2 Final</footer>
  </div>

  <script>
    const askCard = document.querySelector('#ask-card');
    const answerCard = document.querySelector('#answer-card');
    const askButton = document.querySelector('#ask-button');
    const askStatus = document.querySelector('#ask-status');
    const motionStatus = document.querySelector('#motion-status');
    const judgeActions = document.querySelector('#judge-actions');
    const judgementFeedback = document.querySelector('#judgement-feedback');

    async function request(path, body) {
      const response = await fetch(path, {
        method: body ? 'POST' : 'GET',
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '通信に失敗しました');
      return data;
    }

    function render(state) {
      document.querySelector('#round-label').textContent = `判定済み ${state.rounds} 問`;
      document.querySelector('#score-label').textContent = `正解 ${state.score}`;
      if (!state.answer) {
        answerCard.style.display = 'none';
        askCard.style.display = 'block';
        return;
      }

      answerCard.style.display = 'block';
      document.querySelector('#asked-question').textContent = state.question;
      document.querySelector('#ai-answer').textContent = state.answer;
      document.querySelector('#ai-reason').textContent = state.reason;
      askCard.style.display = state.judgement ? 'block' : 'none';
      judgeActions.style.display = state.judgement ? 'none' : 'flex';
      if (!state.judgement) {
        document.querySelectorAll('#judge-actions button').forEach((button) => {
          button.disabled = false;
        });
      }

      if (state.judgement) {
        judgementFeedback.style.display = 'block';
        judgementFeedback.className = `feedback ${state.judgement.correct ? 'good' : 'bad'}`;
        judgementFeedback.textContent = state.judgement.correct
          ? '正解と判定しました。アームに正解の動作を送信しました。'
          : '不正解と判定しました。アームに不正解の動作を送信しました。';
        motionStatus.textContent = state.judgement.motion_status || state.status;
      } else {
        judgementFeedback.style.display = 'none';
        motionStatus.textContent = state.status || '';
      }
    }

    document.querySelector('#ask-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      askButton.disabled = true;
      askStatus.textContent = 'Ollamaが回答しています…';
      try {
        const state = await request('/api/ask', {
          question: document.querySelector('#question-input').value,
        });
        document.querySelector('#question-input').value = '';
        askStatus.textContent = '';
        render(state);
      } catch (error) {
        askStatus.textContent = `Ollamaの起動とモデルを確認してください。${error.message}`;
      } finally {
        askButton.disabled = false;
      }
    });

    async function judge(correct) {
      document.querySelectorAll('#judge-actions button').forEach((button) => { button.disabled = true; });
      motionStatus.textContent = '判定を記録しています…';
      try {
        render(await request('/api/judge', { correct }));
      } catch (error) {
        motionStatus.textContent = error.message;
        document.querySelectorAll('#judge-actions button').forEach((button) => { button.disabled = false; });
      }
    }

    document.querySelector('#correct-button').addEventListener('click', () => judge(true));
    document.querySelector('#incorrect-button').addEventListener('click', () => judge(false));
    document.querySelector('#reset-button').addEventListener('click', async () => {
      const button = document.querySelector('#reset-button');
      button.disabled = true;
      try {
        document.querySelector('#question-input').value = '';
        askStatus.textContent = '';
        render(await request('/api/reset', {}));
      } catch (error) {
        motionStatus.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
    request('/api/state').then(render).catch(() => {});
  </script>
</body>
</html>
